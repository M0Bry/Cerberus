version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: cerberus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cerberus}
      POSTGRES_USER: ${POSTGRES_USER:-cerberus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerberus_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cerberus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerberus-network

  # ─── Redis Cache / Session Store ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cerberus_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cerberus_redis} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./database/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./database/redis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cerberus_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerberus-network

  # ─── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: cerberus_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - uploaded_files:/code/uploads
    networks:
      - cerberus-network

  # ─── Celery Worker (Background AI Tasks) ──────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: cerberus_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - uploaded_files:/code/uploads
    networks:
      - cerberus-network

  # ─── Celery Beat (Scheduled Tasks) ────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: cerberus_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cerberus-network

  # ─── React Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: cerberus_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - cerberus-network

  # ─── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cerberus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cerberus-network

  # ─── Prometheus (Metrics) ─────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: cerberus_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cerberus-network

  # ─── Grafana (Dashboards) ─────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.0
    container_name: cerberus_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - cerberus-network

volumes:
  postgres_data:
  redis_data:
  uploaded_files:
  prometheus_data:
  grafana_data:

networks:
  cerberus-network:
    driver: bridge
