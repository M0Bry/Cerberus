<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background: #0a0a1a; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1a1a2e; border-radius: 12px; padding: 40px; border: 1px solid rgba(0,212,255,0.2); }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 32px; margin-bottom: 8px; }
        .brand { color: #00d4ff; font-size: 24px; font-weight: bold; letter-spacing: 3px; }
        .btn { display: inline-block; background: linear-gradient(135deg, #00d4ff, #6366f1); color: white; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 20px 0; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .stat { text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #00d4ff; }
        .stat-label { font-size: 12px; color: #888; }
        .footer { color: #666; font-size: 12px; margin-top: 30px; text-align: center; border-top: 1px solid #333; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🛡️</div>
            <div class="brand">CERBERUS AI</div>
        </div>
        <h2 style="color: #fff; text-align: center;">Your Report is Ready</h2>
        <p>The penetration testing report for your engagement has been generated successfully.</p>
        <div class="stats">
            <div class="stat">
                <div class="stat-value">{{ total_findings }}</div>
                <div class="stat-label">Total Findings</div>
            </div>
            <div class="stat">
                <div class="stat-value">{{ security_score }}</div>
                <div class="stat-label">Security Score</div>
            </div>
            <div class="stat">
                <div class="stat-value">{{ critical_count }}</div>
                <div class="stat-label">Critical</div>
            </div>
        </div>
        <p style="text-align: center;">
            <a href="{{ download_url }}" class="btn">Download Report (PDF)</a>
        </p>
        <div class="footer">
            <p>Cerberus AI — Intelligent Cybersecurity Platform</p>
        </div>
    </div>
</body>
</html>
