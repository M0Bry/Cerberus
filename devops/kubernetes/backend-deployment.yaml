apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus-backend
  namespace: cerberus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cerberus-backend
  template:
    metadata:
      labels:
        app: cerberus-backend
    spec:
      containers:
        - name: backend
          image: cerberus/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: cerberus-secrets
            - configMapRef:
                name: cerberus-config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
