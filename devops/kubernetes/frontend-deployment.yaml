apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus-frontend
  namespace: cerberus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cerberus-frontend
  template:
    metadata:
      labels:
        app: cerberus-frontend
    spec:
      containers:
        - name: frontend
          image: cerberus/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
