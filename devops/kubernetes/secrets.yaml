apiVersion: v1
kind: Secret
metadata:
  name: cerberus-secrets
  namespace: cerberus
type: Opaque
stringData:
  # These are PLACEHOLDER values — replace with real secrets before deployment.
  # Use Sealed Secrets, SOPS, or External Secrets Operator in production.
  # NEVER commit real secrets to source control.
  SECRET_KEY: "REPLACE_WITH_GENERATED_SECRET"
  DATABASE_URL: "postgresql+asyncpg://cerberus:REPLACE_WITH_DB_PASSWORD@postgres:5432/cerberus_db"
  REDIS_URL: "redis://:REPLACE_WITH_REDIS_PASSWORD@redis:6379/0"
  OPENAI_API_KEY: "REPLACE_WITH_REAL_KEY"
